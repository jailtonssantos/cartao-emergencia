<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de cartão de emergência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#fff;--surface:#f1f4f8;--ink:#14213d;--muted:#566170;--line:#d6dce4;--alert:#b3121d;--alert-bg:#fdecee;--on-alert:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1620;--surface:#18222e;--ink:#e9eef4;--muted:#9aa7b6;--line:#2b3745;--alert:#ff7b82;--alert-bg:#3a1a1e;--on-alert:#0f1620;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0}
h2{font-size:1.05rem;margin:0 0 8px;color:var(--muted)}
a{color:inherit}
:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
.lead{color:var(--muted);margin:0 0 16px}
.privacy{background:var(--surface);border-radius:12px;padding:12px 16px;font-size:.95rem;margin:0 0 8px}
fieldset{border:0;padding:0;margin:22px 0 0}
legend{font-weight:700;padding:0;margin-bottom:8px}
label{display:block;font-size:.95rem;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr auto;align-items:end;margin-bottom:8px}
.row.c{grid-template-columns:1fr 1fr 1fr auto}
.row.m{grid-template-columns:1fr 1fr auto}
.row label{margin:0 0 4px}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.main{background:var(--ink);color:var(--bg)}
.btn.small{padding:8px 12px;font-size:.9rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
#result{margin-top:28px;border-top:2px solid var(--line);padding-top:8px}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:12px;margin:8px 0}
#qr img,#qr canvas{display:block}
.warn{color:var(--alert);font-weight:700}
@media (max-width:520px){.row,.row.c,.row.m{grid-template-columns:1fr 1fr}.row .btn,.row.c .btn{grid-column:1/-1}}

/* cartão */
.sos{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--alert);color:var(--on-alert);text-decoration:none;border-radius:14px;padding:14px 18px;font-weight:700}
.sos span:last-child{font-size:1.6rem}
.id{display:flex;justify-content:space-between;gap:16px;margin:8px 0}
.id p{margin:4px 0 0;color:var(--muted)}
.blood{flex:none;min-width:92px;text-align:center;border:3px solid var(--alert);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center}
.blood b{font-size:2.2rem;line-height:1.1;color:var(--alert)}
.blood small{color:var(--muted);font-size:.85rem}
.flag{background:var(--ink);color:var(--bg);font-weight:700;border-radius:12px;padding:12px 16px;margin:12px 0 0}
section.s{margin-top:22px}
ul{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list small{display:block;color:var(--muted)}
.alert{background:var(--alert-bg);border-left:6px solid var(--alert);border-radius:10px;padding:12px 16px}
.alert h2{color:var(--alert)}.alert ul{font-weight:700}
.contact{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.contact small{color:var(--muted)}
.acoes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.tel{text-decoration:none;color:inherit;white-space:nowrap;border:2px solid var(--ink);border-radius:14px;padding:6px 4px;text-align:center;line-height:1.25}
.tel small{display:block;font-size:.8rem}.tel b{font-size:1.05rem}
.zap{background:#1a7f37;border-color:#1a7f37;color:#fff}.zap small{color:#fff}
.note{background:var(--surface);border-radius:12px;padding:12px 16px;margin:0;white-space:pre-line}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}

/* cartão físico (impressão), conforme o modelo de referência */
#cartaoFisico{--fg:#14213d;--ac:#c1121f;display:flex;flex-direction:column;gap:12px;margin:10px 0 14px}
#cartaoFisico[data-tema="azul"]{--ac:#1d4ed8}
#cartaoFisico[data-tema="verde"]{--ac:#0f766e}
.fw{width:95mm;max-width:100%;container-type:inline-size}
.face{position:relative;width:100%;aspect-ratio:1005/475;background:#fff;color:var(--fg);border:.55cqw solid var(--ac);border-radius:5cqw;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.face *{margin:0}
.ico{display:inline-block;flex:none}
.ico svg{display:block;width:100%;height:100%;fill:currentColor}
.sa{fill:var(--ac)}
.sb{fill:none;stroke:var(--ac)}

.frente{flex-direction:row;overflow:hidden}
.lado{flex:none;width:25cqw;background:var(--ac);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8cqw;padding:2cqw;text-align:center}
.lado-ico{width:15cqw;height:15cqw}
.lado-t{font-size:3.6cqw;line-height:1.08}
.lado hr{border:0;border-top:.45cqw solid #fff;width:80%}
.lado-s{font-size:2cqw;letter-spacing:.12em;line-height:1.3}
.dir{flex:1;min-width:0;display:grid;grid-template-columns:31cqw 1fr;grid-template-rows:1fr auto;gap:1.6cqw 3.5cqw;padding:3cqw 3.5cqw 2cqw 3cqw}
.qrbox{align-self:center;background:#fff;line-height:0;border:.6cqw solid var(--ac);border-radius:3cqw;padding:1.1cqw}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important}
.cf-info{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1.5cqw;min-width:0;text-align:right}
.cf-nome{font-size:4.6cqw;line-height:1.05;overflow-wrap:anywhere}
.cf-idade{display:inline-flex;align-items:center;gap:1.4cqw;font-size:3.9cqw}
.i-cal{width:4cqw;height:4cqw}
.cf-blood{display:flex;align-items:center;justify-content:space-between;gap:2cqw;width:100%;background:var(--ac);color:#fff;border-radius:2.4cqw;padding:.8cqw 3cqw}
.cf-blood small{font-size:2.9cqw;font-weight:700;letter-spacing:.06em}
.cf-blood i{width:.3cqw;height:5cqw;background:#fff}
.cf-blood b{font-size:7.4cqw;line-height:1}
.cf-sep{display:flex;align-items:center;gap:1.5cqw;width:100%;color:var(--ac)}
.cf-sep::before,.cf-sep::after{content:"";flex:1;height:.4cqw;background:var(--ac)}
.i-gota{width:3.2cqw;height:3.8cqw}
.cf-dest{font-size:3.2cqw;line-height:1.15;width:100%;text-align:center}
.cf-scan{grid-column:1/-1;display:flex;align-items:center;gap:2cqw;font-size:2.3cqw}
.cf-scan::before,.cf-scan::after{content:"";flex:1;height:.35cqw;background:var(--ac)}

.vhead{display:flex;align-items:center;gap:2.2cqw;width:80%;background:var(--ac);color:#fff;border-radius:4.4cqw 7cqw 7cqw 0;padding:1.8cqw 4cqw;font-weight:700;font-size:3.2cqw;white-space:nowrap}
.v-ico{width:5cqw;height:5cqw}
.vhead i{width:.3cqw;height:4cqw;background:#fff}
.vbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:.4cqw 4cqw 1.4cqw}
.linha{display:flex;align-items:center;gap:3cqw;padding:1.1cqw 0;border-bottom:.25cqw solid #cdd3dc}
.linha:last-child{border-bottom:0}
.l-ico{width:5.6cqw;height:5.6cqw;color:var(--ac)}
.l-txt{flex:1;font-size:2.9cqw;line-height:1.22}
.l-txt strong{display:block;color:var(--ac);font-size:3.2cqw}
.samu{margin-left:auto;background:var(--ac);color:#fff;font-weight:700;font-size:3.5cqw;border-radius:99px;padding:.7cqw 4cqw;white-space:nowrap}

.temas{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chk{display:flex;gap:10px;align-items:center;margin-top:18px}
.chk input{width:auto}
.scan{background:var(--surface);border-left:6px solid var(--ink);border-radius:10px;padding:12px 16px;margin:16px 0 0}
@media print{
  @page{margin:12mm}
  body *{visibility:hidden}
  #cartaoFisico,#cartaoFisico *{visibility:visible}
  #cartaoFisico{position:absolute;left:0;top:0;margin:0;gap:6mm}
  .face{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  kids.flat().forEach(k => k != null && e.append(k));
  return e;
}
/* ===== CONFIGURAÇÃO DO SERVIDOR (Supabase) =====
   Preencha as duas linhas abaixo para guardar os cartões em servidor (link curto no QR).
   Deixe vazio para usar o modo sem servidor (dados dentro do link). */
const SUPABASE_URL = "";   // ex.: https://abcdefgh.supabase.co
const SUPABASE_KEY = "";   // chave pública "anon" / "publishable" do projeto
const NUVEM = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;
async function rpc(fn, args) {
  const r = await fetch(SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY },
    body: JSON.stringify(args)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
const lines = (t) => t.split("\n").map(s => s.trim()).filter(Boolean);

/* ---------- codificação dos dados no link (sem servidor) ---------- */
function toB64(bytes) {
  let s = ""; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function fromB64(t) {
  const s = atob(t.replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function encode(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ("CompressionStream" in window) {
    const cs = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + toB64(new Uint8Array(await new Response(cs).arrayBuffer()));
  }
  return "r" + toB64(raw);
}
async function decode(s) {
  let bytes = fromB64(s.slice(1));
  if (s[0] === "z") {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes = new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ---------- utilidades ---------- */
function idade(iso) {
  const [a, m, d] = iso.split("-").map(Number);
  const h = new Date();
  let n = h.getFullYear() - a;
  if (h.getMonth() + 1 < m || (h.getMonth() + 1 === m && h.getDate() < d)) n--;
  return n;
}
const soDigitos = (t) => t.replace(/\D/g, "");
function zapNumber(d) {
  if (d.length === 11) return "55" + d;
  if (d.length === 13 && d.startsWith("55")) return d;
  return null;
}

/* ---------- formulário ---------- */
const EXEMPLO = {
  n: "Maria Exemplo", nasc: "1985-03-12", s: "O+", d: "Diabética – usa insulina",
  al: ["Penicilina", "Frutos do mar"], co: ["Diabetes tipo 1", "Hipertensão"],
  me: [{ n: "Insulina NPH", q: "20 unidades às 8h e 10 unidades às 22h" }, { n: "Losartana 50 mg", q: "1 comprimido às 8h" }],
  ct: [{ n: "João Exemplo", p: "Marido", t: "(11) 91234-5678" }, { n: "Ana Exemplo", p: "Filha", t: "(11) 99870-5432" }],
  ob: "Doadora de órgãos. Em crise de hipoglicemia, oferecer açúcar se consciente."
};

function linhaMed(m = {}) {
  const r = el("div", { className: "row m" },
    el("div", {}, el("label", { textContent: "Remédio" }), el("input", { className: "mn", value: m.n || "", placeholder: "Nome e dose" })),
    el("div", {}, el("label", { textContent: "Como toma" }), el("input", { className: "mq", value: m.q || "", placeholder: "Ex.: 1 às 8h e 1 às 20h" })),
    el("button", { type: "button", className: "btn small", textContent: "Remover", onclick: () => r.remove() }));
  return r;
}
function linhaCont(c = {}) {
  const r = el("div", { className: "row c" },
    el("div", {}, el("label", { textContent: "Nome" }), el("input", { className: "cn", value: c.n || "" })),
    el("div", {}, el("label", { textContent: "Parentesco" }), el("input", { className: "cp", value: c.p || "" })),
    el("div", {}, el("label", { textContent: "Telefone com DDD" }), el("input", { className: "ct", type: "tel", value: c.t || "", placeholder: "(83) 99999-9999" })),
    el("button", { type: "button", className: "btn small", textContent: "Remover", onclick: () => r.remove() }));
  return r;
}
function campo(id, rotulo, el_) { el_.id = id; return el("div", {}, el("label", { htmlFor: id, textContent: rotulo }), el_); }

const ESTA_LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1", ""].includes(location.hostname);

function renderForm(edit) {
  const app = $("#app");
  app.replaceChildren();
  const sangue = el("select", {}, ["", "A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"].map(v => el("option", { value: v, textContent: v || "Não sei / não informar" })));
  const meds = el("div", { id: "meds" }), conts = el("div", { id: "conts" });

  const form = el("form", { id: "form", onsubmit: (e) => { e.preventDefault(); gerar(edit); } },
    el("fieldset", {}, el("legend", { textContent: "Quem é" }),
      campo("f-n", "Nome completo", el("input", { required: true })),
      campo("f-nasc", "Data de nascimento (mostra só a idade)", el("input", { type: "date" })),
      campo("f-s", "Tipo sanguíneo", sangue),
      campo("f-d", "Destaque principal (opcional)", el("input", { placeholder: "Ex.: Transplantado renal, Diabético, Usa marcapasso" }))),
    el("fieldset", {}, el("legend", { textContent: "Contatos de emergência" }), conts,
      el("button", { type: "button", className: "btn small", textContent: "+ Adicionar contato", onclick: () => conts.append(linhaCont()) })),
    el("fieldset", {}, el("legend", { textContent: "Remédios de uso diário" }), meds,
      el("button", { type: "button", className: "btn small", textContent: "+ Adicionar remédio", onclick: () => meds.append(linhaMed()) })),
    el("fieldset", {}, el("legend", { textContent: "Saúde" }),
      campo("f-al", "Alergias (uma por linha)", el("textarea")),
      campo("f-co", "Condições importantes (uma por linha)", el("textarea")),
      campo("f-ob", "Observações (opcional)", el("textarea"))),
    ESTA_LOCAL ? el("fieldset", {}, el("legend", { textContent: "Endereço do site" }),
      el("p", { className: "privacy", textContent: "Você abriu o arquivo direto do computador. O QR code precisa apontar para o endereço onde o site fica no ar (por exemplo, o do GitHub Pages). Preencha abaixo." }),
      campo("f-base", "Endereço do site publicado", el("input", { type: "url", placeholder: "https://seuusuario.github.io/cartao-emergencia/" }))) : null,
    el("label", { className: "chk" }, el("input", { type: "checkbox", id: "f-verso", checked: true }), "Incluir verso do cartão (contatos, alergias e condições escritos no papel)"),
    NUVEM && !edit ? el("label", { className: "chk" }, el("input", { type: "checkbox", id: "f-ok" }), "Autorizo guardar estes dados, inclusive de saúde, em servidor para o QR code funcionar. Posso apagar quando quiser.") : null,
    el("div", { className: "actions" },
      el("button", { type: "submit", className: "btn main", textContent: edit ? "Salvar alterações" : "Gerar cartão e QR code" }),
      edit ? el("button", { type: "button", className: "btn", textContent: "Apagar cartão", onclick: () => apagar(edit) }) : null,
      edit ? null : el("button", { type: "button", className: "btn", textContent: "Preencher com exemplo", onclick: () => preencher(EXEMPLO) })),
    el("div", { id: "result", hidden: true })
  );

  app.append(
    el("h1", { textContent: "Gerador de cartão de emergência" }),
    el("p", { className: "privacy", textContent: "Site de demonstração (projeto de portfólio). Use dados fictícios para testar e não dependa só deste cartão como identificação médica." }),
    el("p", { className: "lead", textContent: "Preencha, gere o QR code e cole no verso do celular, na carteira ou no chaveiro. Em uma emergência, quem escanear vê suas informações e liga para sua família com um toque." }),
    el("p", { className: "privacy", textContent: NUVEM ? "Privacidade: seus dados ficam guardados em um servidor e o QR code leva a um link curto. Quem tiver o link ou o QR vê as informações, então coloque só o essencial (sem CPF e sem endereço). Você pode editar ou apagar o cartão quando quiser, com o link de edição." : "Privacidade: nada é enviado para servidor nem guardado em banco de dados. Os dados ficam dentro do próprio link e do QR code. Quem tiver o link ou o QR vê as informações, então coloque só o essencial (sem CPF e sem endereço)." }),
    form
  );
  if (edit) preencher(edit.dados); else { conts.append(linhaCont()); meds.append(linhaMed()); }
}

async function apagar(edit) {
  if (!confirm("Apagar este cartão definitivamente? O QR code deixará de funcionar.")) return;
  try {
    await rpc("apagar_cartao", { p_id: edit.id, p_token: edit.token });
    $("#app").replaceChildren(el("h1", { textContent: "Cartão apagado" }), el("p", { textContent: "Seus dados foram removidos do servidor." }),
      el("a", { className: "btn", href: location.href.split("#")[0].split("?")[0], textContent: "Criar um novo cartão" }));
  } catch { alert("Não foi possível apagar agora. Tente de novo."); }
}

function preencher(d) {
  $("#f-n").value = d.n; $("#f-nasc").value = d.nasc || ""; $("#f-s").value = d.s || ""; $("#f-d").value = d.d || "";
  $("#f-al").value = (d.al || []).join("\n"); $("#f-co").value = (d.co || []).join("\n"); $("#f-ob").value = d.ob || "";
  $("#meds").replaceChildren(...(d.me || []).map(linhaMed));
  $("#conts").replaceChildren(...(d.ct || []).map(linhaCont));
}
function coletar() {
  return {
    n: $("#f-n").value.trim(), nasc: $("#f-nasc").value, s: $("#f-s").value, d: $("#f-d").value.trim(),
    al: lines($("#f-al").value), co: lines($("#f-co").value), ob: $("#f-ob").value.trim(),
    me: [...document.querySelectorAll("#meds .row")].map(r => ({ n: $(".mn", r).value.trim(), q: $(".mq", r).value.trim() })).filter(m => m.n),
    ct: [...document.querySelectorAll("#conts .row")].map(r => ({ n: $(".cn", r).value.trim(), p: $(".cp", r).value.trim(), t: $(".ct", r).value.trim() })).filter(c => c.n && c.t)
  };
}

const ICONES = {
  estrela: '<svg viewBox="0 0 100 100"><g fill="#fff"><rect x="40" y="3" width="20" height="94" rx="3"/><rect x="40" y="3" width="20" height="94" rx="3" transform="rotate(60 50 50)"/><rect x="40" y="3" width="20" height="94" rx="3" transform="rotate(120 50 50)"/></g><rect class="sa" x="47" y="20" width="6" height="60" rx="1"/><path class="sb" d="M50 26c-10 6 10 12 0 18s10 12 0 18" stroke-width="4"/></svg>',
  calendario: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 18h2M11 18h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>',
  gota: '<svg viewBox="0 0 24 24"><path d="M12 2C9 8 5.5 11 5.5 15.5a6.5 6.5 0 0 0 13 0C18.5 11 15 8 12 2z"/></svg>',
  pessoa: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 22c0-5.2 4-8 9-8s9 2.8 9 8z"/></svg>',
  alerta: '<svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2z"/><path d="M12 9v6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="18" r="1.3" fill="#fff"/></svg>',
  cruz: '<svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>',
  info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7.5" r="1.5"/><path d="M12 11v7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
};
function ico(nome, cls) {
  const sp = el("span", { className: "ico " + (cls || "") });
  sp.setAttribute("aria-hidden", "true");
  sp.innerHTML = ICONES[nome];
  return sp;
}

async function gerar(edit) {
  const dados = coletar();
  const out = $("#result");
  out.hidden = false;
  let base = location.href.split("#")[0].split("?")[0];
  const campoBase = $("#f-base");
  if (campoBase) {
    const b = campoBase.value.trim();
    if (!/^https?:\/\//i.test(b)) {
      out.replaceChildren(el("p", { className: "warn", textContent: "Preencha o endereço do site publicado (começando com https://) para o QR code abrir o cartão em qualquer celular." }));
      return;
    }
    base = b.split("#")[0].split("?")[0];
  }
  let link, linkEdicao = null;
  if (NUVEM) {
    if (!edit && !$("#f-ok").checked) {
      out.replaceChildren(el("p", { className: "warn", textContent: "Marque a autorização para guardar os dados em servidor." }));
      return;
    }
    try {
      if (edit) {
        if (!(await rpc("atualizar_cartao", { p_id: edit.id, p_token: edit.token, p_dados: dados }))) throw new Error("token");
        link = base + "?c=" + edit.id;
        linkEdicao = base + "?edit=" + edit.id + "#k=" + edit.token;
      } else {
        const r = await rpc("criar_cartao", { p_dados: dados });
        link = base + "?c=" + r.id;
        linkEdicao = base + "?edit=" + r.id + "#k=" + r.token;
      }
    } catch (e) {
      out.replaceChildren(el("p", { className: "warn", textContent: "Não consegui salvar o cartão agora. Confira a conexão e tente de novo." }));
      return;
    }
  } else {
    link = base + "#c=" + (await encode(dados));
  }
  out.replaceChildren(el("h2", { textContent: "Seu cartão está pronto" }));

  const qr = el("div", { className: "qrbox" });
  try {
    new QRCode(qr, { text: link, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.L });
  } catch (e) {
    out.append(el("p", { className: "warn", textContent: "Há informação demais para caber num QR code. Reduza observações, remédios ou condições e gere de novo." }));
    return;
  }
  if (link.length > 1500) out.append(el("p", { className: "warn", textContent: "O QR ficou denso e pode ser difícil de ler. Imprima em tamanho maior ou reduza o texto." }));

  const frente = el("div", { className: "face frente" },
    el("div", { className: "lado" },
      ico("estrela", "lado-ico"),
      el("strong", { className: "lado-t", textContent: "EMERGÊNCIA MÉDICA" }),
      el("hr"),
      el("span", { className: "lado-s", textContent: "INFORMAÇÕES IMPORTANTES" })),
    el("div", { className: "dir" }, qr,
      el("div", { className: "cf-info" },
        el("strong", { className: "cf-nome", textContent: dados.n }),
        dados.nasc ? el("span", { className: "cf-idade" }, ico("calendario", "i-cal"), idade(dados.nasc) + " anos") : null,
        dados.s ? el("span", { className: "cf-blood" }, el("small", { textContent: "SANGUE" }), el("i"), el("b", { textContent: dados.s })) : null,
        dados.d ? [el("span", { className: "cf-sep" }, ico("gota", "i-gota")), el("span", { className: "cf-dest", textContent: dados.d })] : null),
      el("div", { className: "cf-scan", textContent: "Escaneie para ver contatos, alergias e condições" })));
  const faces = [frente];
  if ($("#f-verso").checked) {
    const linha = (icone, titulo, textos) => textos.length
      ? el("div", { className: "linha" }, ico(icone, "l-ico"),
          el("div", { className: "l-txt" }, el("strong", { textContent: titulo }), textos.map(t => el("div", { textContent: t })))) : null;
    const linhas = [
      linha("pessoa", "Ligar para", dados.ct.slice(0, 3).map(c => c.n + (c.p ? " (" + c.p + ")" : "") + " – " + c.t)),
      linha("alerta", "Alergias", [dados.al.join("; ")].filter(Boolean)),
      linha("cruz", "Condições", [dados.co.join(", ")].filter(Boolean))
    ].filter(Boolean);
    const samu = el("span", { className: "samu", textContent: "SAMU 192" });
    if (linhas.length) linhas[linhas.length - 1].append(samu); else linhas.push(el("div", { className: "linha" }, samu));
    faces.push(el("div", { className: "face verso" },
      el("div", { className: "vhead" }, ico("info", "v-ico"), el("i"), el("span", { textContent: "INFORMAÇÕES DE EMERGÊNCIA" })),
      el("div", { className: "vbody" }, linhas)));
  }
  const cartao = el("div", { id: "cartaoFisico", "data-tema": "vermelho" }, faces.map(f => el("div", { className: "fw" }, f)));
  const nomesTema = { vermelho: "Vermelho", azul: "Azul", verde: "Verde" };
  const temas = el("div", { className: "temas" }, Object.entries(nomesTema).map(([k, v]) =>
    el("button", { type: "button", className: "btn small", textContent: v, "aria-pressed": String(k === "vermelho"), onclick: (e) => {
      cartao.dataset.tema = k;
      temas.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === e.currentTarget)));
    } })));

  const campoLink = el("input", { readOnly: true, value: link, "aria-label": "Link do cartão", onfocus: (e) => e.target.select() });
  out.append(
    el("p", { className: "lead", textContent: "Escolha a cor do cartão:" }), temas,
    cartao,
    el("div", { className: "actions" },
      el("button", { type: "button", className: "btn main", textContent: "Imprimir cartão", onclick: () => window.print() }),
      el("button", { type: "button", className: "btn", textContent: "Baixar QR code", onclick: () => {
        const c = qr.querySelector("canvas");
        el("a", { href: c.toDataURL("image/png"), download: "qrcode-cartao-emergencia.png" }).click();
      } })),
    el("p", { className: "scan" },
      el("strong", { textContent: "Agora confira: " }),
      "escaneie o QR code acima com a câmera de outro celular para ver suas informações no site, do jeito que quem te socorrer vai ver. Se estiver usando um só aparelho, toque em ",
      el("a", { href: link, target: "_blank", rel: "noopener", textContent: "abrir cartão" }), "."),
    el("p", { className: "lead", textContent: "Dica: na tela de impressão você também pode escolher “Salvar como PDF”. Teste o QR antes de plastificar ou colar." }),
    el("label", { textContent: "Link do cartão (guarde se quiser reenviar)" }), campoLink,
    el("div", { className: "actions" }, el("button", { type: "button", className: "btn small", textContent: "Copiar link", onclick: async (e) => {
      try { await navigator.clipboard.writeText(link); e.target.textContent = "Copiado!"; } catch { campoLink.select(); }
    } }))
  );
  if (linkEdicao) {
    out.append(
      el("p", { className: "scan" }, el("strong", { textContent: "Guarde o link de edição: " }),
        "é o único jeito de alterar ou apagar este cartão depois. Não compartilhe e não perca."),
      el("input", { readOnly: true, value: linkEdicao, "aria-label": "Link de edição", onfocus: (e) => e.target.select() }));
  }
  cartao.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* ---------- cartão (quem escaneia vê isto) ---------- */
function secao(titulo, itens, classe) {
  if (!itens.length) return null;
  return el("section", { className: "s " + (classe || "") }, el("h2", { textContent: titulo }),
    el("ul", { className: classe ? "" : "list" }, itens));
}
function renderCartao(p) {
  const app = $("#app");
  app.replaceChildren();
  document.title = "Cartão de emergência – " + p.n;

  app.append(el("div", { className: "id" },
    el("div", {}, el("h1", { textContent: p.n }), p.nasc ? el("p", { textContent: idade(p.nasc) + " anos" }) : null),
    p.s ? el("div", { className: "blood" }, el("small", { textContent: "Sangue" }), el("b", { textContent: p.s })) : null));
  if (p.d) app.append(el("p", { className: "flag", textContent: p.d }));
  app.append(el("a", { className: "sos", href: "tel:192" }, el("span", { textContent: "Aperte para ligar no SAMU" }), el("span", { textContent: "192" })));

  if (p.ct && p.ct.length) {
    const sec = el("section", { className: "s" }, el("h2", { textContent: "Ligar para a família" }));
    p.ct.forEach(c => {
      const d = soDigitos(c.t), z = zapNumber(d);
      sec.append(el("div", { className: "contact" },
        el("span", {}, el("strong", { textContent: c.n + " " }), el("small", { textContent: c.p || "" })),
        el("span", { className: "acoes" },
          el("a", { className: "tel", href: "tel:" + d }, el("small", { textContent: "Aperte para ligar" }), el("b", { textContent: c.t })),
          z ? el("a", { className: "tel zap", href: "https://wa.me/" + z }, el("small", { textContent: "Aperte para chamar" }), el("b", { textContent: "WhatsApp" })) : null)));
    });
    app.append(sec);
  }
  app.append(
    secao("Remédios de uso diário", (p.me || []).map(m => el("li", {}, el("strong", { textContent: m.n }), el("small", { textContent: m.q || "" })))),
    secao("Alergias", (p.al || []).map(t => el("li", { textContent: t })), "alert"),
    secao("Condições importantes", (p.co || []).map(t => el("li", { textContent: t })))
  );
  if (p.ob) app.append(el("section", { className: "s" }, el("h2", { textContent: "Observações" }), el("p", { className: "note", textContent: p.ob })));
  app.append(el("footer", {},
    "Informações preenchidas pelo próprio usuário; não substituem avaliação médica. ",
    el("a", { href: location.href.split("#")[0], textContent: "Criar o meu cartão" })));
}

/* ---------- início ---------- */
async function iniciar() {
  const q = new URLSearchParams(location.search);
  const m = location.hash.match(/^#c=(.+)$/);
  const k = (location.hash.match(/^#k=(.+)$/) || [])[1];
  try {
    if (NUVEM && q.get("c")) {
      const d = await rpc("obter_cartao", { p_id: q.get("c") });
      if (!d) throw new Error("nao encontrado");
      return renderCartao(d);
    }
    if (NUVEM && q.get("edit")) {
      const d = await rpc("obter_cartao", { p_id: q.get("edit") });
      if (!d || !k) throw new Error("edicao");
      return renderForm({ id: q.get("edit"), token: k, dados: d });
    }
    if (m) return renderCartao(await decode(m[1]));
    return renderForm();
  } catch {
    $("#app").replaceChildren(el("h1", { textContent: "Cartão não encontrado" }),
      el("p", { textContent: "O link pode estar incompleto ou o cartão foi apagado." }),
      el("a", { className: "btn", href: location.href.split("#")[0].split("?")[0], textContent: "Criar um cartão" }));
  }
}
window.addEventListener("hashchange", iniciar);
iniciar();
</script>
